# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: com.moovi.teste.zui5empresainspetorv2
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://ndc-srvhana.opus-idc.com.br:8100
          client: '250'
        app:
          name: ZLMSADM
          description: App Inspetor de Empresas V2
          package: $TMP
          transport: ''
        exclude:
          - /test/
